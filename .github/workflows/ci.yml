name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (no external services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --extra orchestration --extra benchmark --frozen

      # Линтер до тестов: он дешевле и ловит то, что тесты пропускают.
      # Без этого шага в dev уехали задвоенный импорт в eval/cli.py и мёртвые
      # присваивания в eval/cache.py - CI гонял только pytest и был зелёным.
      - name: Lint (ruff)
        # Только `check`: `format --check` сейчас красный на 20 файлах,
        # приводить их к формату надо отдельным коммитом, чтобы не смешивать
        # содержательные правки с переформатированием.
        run: uv run ruff check .

      - name: Run tests (unit, corpus & orchestration; no live servers)
        run: uv run pytest -m "not integration"
