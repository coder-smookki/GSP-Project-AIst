services:
  qdrant:
    # Версия пинуется и должна совпадать по minor с qdrant-client в pyproject:
    # при расхождении больше единицы клиент пишет предупреждение в каждый лог.
    # Встроенный BM25 доступен с v1.15.2, поэтому ниже опускаться нельзя.
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      # Qdrant по умолчанию отправляет телеметрию на telemetry.qdrant.io.
      # Для кейса это прямое нарушение блокирующего критерия «0 внешних API».
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Именно bash, а не CMD-SHELL: /dev/tcp — возможность bash, а `sh` в
      # этом образе указывает на dash, где такой проверки нет. С CMD-SHELL
      # healthcheck падал с «cannot create /dev/tcp: Directory nonexistent»,
      # контейнер навсегда оставался unhealthy, и зависящие от него aegra и
      # gui не стартовали вообще. curl и wget в образ не входят.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT_MAP:-5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aegra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegra:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${AEGRA_PORT:-2026}:2026"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - REDIS_BROKER_ENABLED=${REDIS_BROKER_ENABLED:-false}
      - PYTHONPATH=${PYTHONPATH:-/app}
      - OLLAMA_LOCAL_BASE_URL=${OLLAMA_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
      - RETRIEVAL_PROVIDER=${RETRIEVAL_PROVIDER:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-aist_chunks}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./aegra.json:/app/aegra.json:ro

  gui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gui
    restart: unless-stopped
    ports:
      - "${GUI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - AEGRA_URL=${AEGRA_URL:-http://aegra:2026}
      - GUI_DATABASE_URL=${GUI_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/chainlit}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      aegra:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
