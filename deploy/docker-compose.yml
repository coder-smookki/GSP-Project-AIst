# Корень стека: интерфейс + агент + общая БД. Инфраструктурные слои
# подключаются через include и поднимаются той же командой `docker compose up -d`.
# Слой можно отключить, убрав его из include, либо поднять/остановить отдельно
# командами вида `docker compose -f docker-compose.qdrant.yml ...`.
include:
  - docker-compose.qdrant.yml
  - docker-compose.orchestration.yml

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Только на петлевой интерфейс: в базе лежат пароли пользователей
      # интерфейса и вся переписка.
      - "${POSTGRES_PORT_MAP:-127.0.0.1:5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aegra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegra:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      # Только на петлевой интерфейс. Aegra работает без аутентификации
      # (в логах её собственный user_id=anonymous), поэтому доступный по
      # сети порт 2026 позволяет кому угодно запускать граф и, подставив
      # configurable.user_id, читать чужую долгосрочную память. Интерфейс
      # ходит к ней по внутренней сети docker, host-порт нужен только для
      # /health и отладки.
      - "127.0.0.1:${AEGRA_PORT:-2026}:2026"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - REDIS_BROKER_ENABLED=${REDIS_BROKER_ENABLED:-false}
      - PYTHONPATH=${PYTHONPATH:-/app}
      - OLLAMA_LOCAL_BASE_URL=${OLLAMA_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
      - RETRIEVAL_PROVIDER=${RETRIEVAL_PROVIDER:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-aist_chunks}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - RERANK_ENDPOINT=${RERANK_ENDPOINT:-http://host.docker.internal:8899}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./aegra.json:/app/aegra.json:ro

  gui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gui
    restart: unless-stopped
    ports:
      - "${GUI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - AEGRA_URL=${AEGRA_URL:-http://aegra:2026}
      - GUI_DATABASE_URL=${GUI_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/chainlit}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      aegra:
        condition: service_started

volumes:
  postgres_data:
