# Слой: оркестрация индексации. Prefect-сервер с UI (:4200) и раннеры.
# Подключается из docker-compose.yml через include и поднимается как часть
# `docker compose up -d`. Отдельно:
#   docker compose -f docker-compose.orchestration.yml up -d
#
# Модель: один deployment в Prefect UI = один контейнер-раннер.
# Каждый раннер регистрирует свой deployment при старте (`serve` в
# infrastructure/orchestration/serve.py) и ждёт запусков только в нём.
# Чтобы добавить новый пайплайн (другая модель/поколение/источник) — добавь
# сервис prefect-runner_... (идентично примеру в конце файла) и подними его:
#   docker compose up -d prefect-runner-qwen3-v2
# Существующие раннеры не трогаются, образ не пересобирается.

# ---- общая копия окружения для любого раннера --------------------------------
x-runner-env: &runner-env
  # Куда стучаться за деплойментами: имя сервиса из того же compose-файла.
  PREFECT_API_URL: http://prefect-server:4200/api
  # Индекс и эмбеддинги — сервисы слоя Qdrant и Ollama на хосте.
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-aist_chunks}
  OLLAMA_LOCAL_BASE_URL: ${OLLAMA_LOCAL_BASE_URL:-http://host.docker.internal:11434}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama-local}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-}
  # Расписание и параметры deployment (наследуется из .env основного стека).
  AIST_CRON: ${AIST_CRON:-}
  AIST_SOURCE_KIND: ${AIST_SOURCE_KIND:-files}
  AIST_CORPUS_DIR: ${AIST_CORPUS_DIR:-/corpus}
  AIST_SECTION_ID: ${AIST_SECTION_ID:-}
  AIST_LIMIT: ${AIST_LIMIT:-}
  AIST_DRY_RUN: ${AIST_DRY_RUN:-0}
  AIST_FULL: ${AIST_FULL:-0}
  AIST_SWITCH_ALIAS: ${AIST_SWITCH_ALIAS:-1}
  # Учётные данные базы знаний для --source api: те же, что у основного
  # стека (KB_EMAIL / KB_PASSWORD в deploy/.env).
  KB_BASE_URL: ${KB_BASE_URL:-}
  KB_EMAIL: ${KB_EMAIL:-}
  KB_PASSWORD: ${KB_PASSWORD:-}
  KB_SECTION_ID: ${KB_SECTION_ID:-44030}
  KB_TOKEN_NAME: ${KB_TOKEN_NAME:-aist}
  KB_PER_PAGE: ${KB_PER_PAGE:-100}
  KB_MAX_RETRIES: ${KB_MAX_RETRIES:-3}

# ---- каркас сервиса-раннера: образ, рестарт, монтирования -------------------
x-runner-common: &runner-common
  image: aist-prefect-runner
  build:
    context: ..
    dockerfile: deploy/Dockerfile.orchestration
  restart: unless-stopped
  depends_on:
    # Только prefect-server: serve на старте лишь регистрирует deployment, а
    # Qdrant нужен уже в момент прогона (и живёт в отдельном слое — он не
    # должен блокировать регистрацию).
    prefect-server:
      condition: service_healthy
  volumes:
    # Каталог корпуса для --source files монтируется с хоста; ядро внутри
    # контейнера нельзя считать надёжным источником выгрузки.
    - ${AIST_CORPUS_MOUNT:-../corpus}:/corpus:ro

services:
  prefect-server:
    # Версия пинуется и совпадает с `prefect==3.8.2` в pyproject.toml, чтобы
    # сервер и клиент (раннер) говорили на одном API. Отдельный круг Python
    # Prefect здесь не нужен — образ официальный и уже содержит CLI.
    image: prefecthq/prefect:3.8.2-python3.12
    restart: unless-stopped
    # В образе нет команды по умолчанию: entrypoint без аргументов уходит в
    # интерактивный bash, который в компоузе мгновенно завершается (exit 0).
    # Поэтому сервер запускается явной командой.
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      # Метаданные — локальный SQLite в volume; Postgres не нужен, пока планировщик
      # один и история прогонов маленькая.
      PREFECT_HOME: "/root/.prefect"
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:////root/.prefect/prefect.db"
      PREFECT_API_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:////root/.prefect/prefect.db"
      PREFECT_UI_ENABLED: "true"
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_API_PORT: "4200"
    ports:
      # Только на петлевой интерфейс: UI без аутентификации отдаёт прогоны и
      # параметры flow — наружу торчать ему незачем. Раннеры ходят по внутренней
      # сети docker.
      - "127.0.0.1:${PREFECT_UI_PORT:-4200}:4200"
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      # healthcheck на python-файле, а не на curl: bash в этой образе не
      # гарантирован, а urllib есть всегда. /api/health отвечает 200, как
      # только сервер поднял приложение.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------- раннеры ---
  # Один deployment = один раннер. Имя deployment задаёт AIST_DEPLOYMENT_NAME;
  # все параметры (модель, поколение, источник, расписание) — через AIST_*/EMBEDDING_*.
  #
  # Три модельных раннера на три эмбеддера. Размерности разные, поэтому каждому
  # кандидату — своя коллекция-поколение:
  #   bge-m3:567m          (1024) → aist_chunks_v1  (существующий боевой индекс)
  #   qwen3-embedding:4b   (2560) → aist_chunks_v2
  #   qwen3-embedding:8b   (4096) → aist_chunks_v3
  # Алиас не трогаем (AIST_SWITCH_ALIAS=0): он остаётся на v1, пока не выберем
  # лучшую модель по золотому набору. Переключить — запустив прогон нужного
  # раннера с параметром switch_alias=true.

  # Дефолтный раннер = baseline на bge-m3:567m. Параметры берутся из .env
  # основного стека; здесь они зафиксированы явно, чтобы deployment был
  # воспроизводим.
  prefect-runner:
    <<: *runner-common
    environment:
      <<: *runner-env
      AIST_DEPLOYMENT_NAME: ${AIST_DEPLOYMENT_NAME:-aist-ingest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:567m}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-}
      AIST_GENERATION: 1
      AIST_FULL: ${AIST_FULL:-0}
      AIST_SWITCH_ALIAS: 0

  # qwen3-embedding:4b → v2. Другая размерность, поэтому полная переиндексация.
  prefect-runner-qwen4b:
    <<: *runner-common
    environment:
      <<: *runner-env
      AIST_DEPLOYMENT_NAME: aist-ingest-qwen4b
      EMBEDDING_MODEL: qwen3-embedding:4b
      EMBEDDING_QUERY_INSTRUCTION: "Найди в базе знаний фрагменты, релевантные этому вопросу: "
      AIST_GENERATION: 2
      AIST_FULL: 1
      AIST_SWITCH_ALIAS: 0

  # qwen3-embedding:8b → v3. Другая размерность, поэтому полная переиндексация.
  prefect-runner-qwen8b:
    <<: *runner-common
    environment:
      <<: *runner-env
      AIST_DEPLOYMENT_NAME: aist-ingest-qwen8b
      EMBEDDING_MODEL: qwen3-embedding:8b
      EMBEDDING_QUERY_INSTRUCTION: "Найди в базе знаний фрагменты, релевантные этому вопросу: "
      AIST_GENERATION: 3
      AIST_FULL: 1
      AIST_SWITCH_ALIAS: 0

volumes:
  prefect_data: