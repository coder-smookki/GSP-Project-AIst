[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.3.14",
    "langchain_community==0.4.2",
    "pydantic-settings==2.14.2",
    "langchain-openai==1.3.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "openinference-instrumentation-langchain==0.1.67",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "chainlit>=2.11.0",
    "langgraph-sdk>=0.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live server",
    "llm: requires a real LLM model (Ollama) - excluded from fast CI",
    "embeddings: requires a real embedding model (Ollama) - excluded from fast CI",
    "tools: tests ai agents tool"
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
extend-ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"agent/graph.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["infrastructure*", "agent*", "domain*", "tests*", "gui*"]
